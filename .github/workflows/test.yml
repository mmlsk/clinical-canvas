name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Node test suite
        run: node --test tests/*.test.cjs

      - name: Run Python test suite
        run: python3 -m unittest tests/test_server.py

      - name: Check JavaScript syntax
        run: |
          node --check clinical-canvas/graph-model.js
          node --check clinical-canvas/app.js
          node --check clinical-canvas/calculators.js
          node --check clinical-canvas/score-engine.js

      - name: Build standalone bundle
        run: node build-clinical-canvas.mjs

      - name: Upload standalone HTML bundle
        uses: actions/upload-artifact@v4
        with:
          name: standalone-clinical-canvas
          path: makieta-medyczna-canvas.html
          retention-days: 14

      - name: Prepare GitHub Pages directory
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir -p _site
          cp makieta-medyczna-canvas.html _site/index.html
          cp makieta-medyczna-canvas.html _site/makieta-medyczna-canvas.html

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
