name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Node test suite
        run: node --test tests/clinical-scores.test.cjs

      - name: Run Python test suite
        run: python3 -m unittest tests/test_server.py

      - name: Check JavaScript syntax
        run: |
          node --check clinical-canvas/app.js
          node --check clinical-canvas/calculators.js
          node --check clinical-canvas/score-engine.js

      - name: Build standalone bundle
        run: node build-clinical-canvas.mjs

      - name: Upload standalone HTML bundle
        uses: actions/upload-artifact@v4
        with:
          name: standalone-clinical-canvas
          path: makieta-medyczna-canvas.html
          retention-days: 14
